name: Build and Release

on: [ push, pull_request ]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  doc_and_release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: ./Dokumentation/src
          root_file: anleitung.tex
#      - name: Upload PDF file
#        uses: actions/upload-artifact@v6
#        with:
#          name: Anleitung
#          path: Dokumentation/src/anleitung.pdf
      - name: Get previous tag
        id: previousTag
        run: |
          name=$(git --no-pager tag --sort=creatordate --merged ${GITHUB_REF}^ | tail -1)
          echo "previousTag: $name"
          echo "previousTag=$name" >> $GITHUB_ENV
      - name: Generate CHANGELOG
        run: |
          echo "## Version ${{ github.ref_name }} - $(date +'%Y-%m-%d')" > release.txt
          echo "### Neu" >> release.txt
          git log --format="- %s" --grep="\[[F|f]eature\].*" ${{ env.previousTag }}..${{ github.ref_name }} | sed 's/\[[F|f]eature\]:* //g' >> release.txt
          echo "### Verbessert" >> release.txt
          git log --format="- %s" --grep="\[[I|i]mprovement\].*" ${{ env.previousTag }}..${{ github.ref_name }} | sed 's/\[[I|i]mprovement\]:* //g' >> release.txt
          echo "### Fehlerbehebungen" >> release.txt
          git log --format="- %s" --grep="\[[B|b]ugfix\].*" ${{ env.previousTag }}..${{ github.ref_name }} | sed 's/\[[B|b]ugfix\]:* //g' >> release.txt
#      - name: Upload artifacts
#        uses: actions/upload-artifact@v6
#        with:
#          name: changelog
#          path: release.txt
#          if-no-files-found: error
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release.txt
          files: |
            Dokumentation/src/anleitung.pdf

  build:
    runs-on: macos-15-intel
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3
      EPL_IMAGE: EPL-${{ github.ref_name }}-macos-intel
    timeout-minutes: 15
    steps:
      - name: Set up Git repo
        uses: actions/checkout@v6
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          use-official: true
          email: ${{ secrets.QT_EMAIL }}
          pw: ${{ secrets.QT_PW }}
          target: 'desktop'
          arch: 'clang_64'
          version: '6.10.2'
          host: 'mac'
          aqtversion: '==3.3.*'
      - name: Upload aqtinstall log file
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: aqtinstall-log-macos-15-clang-6.10.2
          path: aqtinstall.log
          if-no-files-found: error
      - name: Build
        env:
          PROJECT_BUILD_ID: "${{ github.run_number }}.macos-15.clang.qt-6.10.2"
        run: |
          qmake Programm/epl.pro
          make -j8
      - name: Create app bundles
        run: |
            macdeployqt "Einsatzplaner/Einsatzplaner.app" -verbose=2
            macdeployqt "Personalplaner/Personalplaner.app" -verbose=2
      - name: Create disk image
        run: |
            mkdir ${{ EPL_IMAGE_NAME }}
            cp -r Einsatzplaner/Einsatzplaner.app ${{ EPL_IMAGE_NAME }}
            cp -r Personalplaner/Personalplaner.app ${{ EPL_IMAGE_NAME }}
            hdiutil create -srcfolder ${{ EPL_IMAGE_NAME }} ${{ EPL_IMAGE_NAME }}.dmg
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        if: github.ref_type != 'tag'
        with:
          name: ${{ EPL_IMAGE_NAME }}
          path: ${{ EPL_IMAGE_NAME }}.dmg
          if-no-files-found: error
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            ${{ EPL_IMAGE_NAME }}.dmg
