name: Build and Test

on: [ push, pull_request ]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  doc_and_release:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6
      - name: Get previous tag
        id: previousTag
        run: |
          name=$(git --no-pager tag --sort=creatordate --merged ${GITHUB_REF}^ | tail -1)
          echo "previousTag: $name"
          echo "previousTag=$name" >> $GITHUB_ENV
      - name: Update CHANGELOG
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          fromTag: ${{ env.GITHUB_REF }}
          toTag: ${{ env.previousTag }}
          writeToFile: true
          changelogFilePath: release.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: changelog
          path: release.txt
          if-no-files-found: error

  build:
    runs-on: macos-15-intel
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3
    timeout-minutes: 15
    steps:
      - name: Set up Git repo
        uses: actions/checkout@v6
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          use-official: true
          email: ${{ secrets.QT_EMAIL }}
          pw: ${{ secrets.QT_PW }}
          target: 'desktop'
          arch: 'clang_64'
          version: '6.10.2'
          host: 'mac'
          aqtversion: '==3.3.*'
      - name: Upload aqtinstall log file
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: aqtinstall-log-macos-15-clang-6.10.2
          path: aqtinstall.log
          if-no-files-found: error
      - name: Build
        id: build
        env:
          PROJECT_BUILD_ID: "${{ github.run_number }}.macos-15.clang.qt-6.10.2"
        run: |
          qmake Programm/epl.pro;
          make;
      - name: Make app bundles
        run: |
            macdeployqt "Einsatzplaner/Einsatzplaner.app" -verbose=2
            macdeployqt "Personalplaner/Personalplaner.app" -verbose=2
      - name: Make dmg
        run: |
            mkdir EPL
            cp -r Einsatzplaner/Einsatzplaner.app EPL
            cp -r Personalplaner/Personalplaner.app EPL
            hdiutil create -srcfolder EPL EPL.dmg
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: EPL
          path: EPL.dmg
          if-no-files-found: error
